[project]
name = "anti-procrastination-backend"
version = "0.1.0"
description = "FastAPI backend for anti-procrastination app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "openai>=1.30",
    "stripe>=9.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
package = false
